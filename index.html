<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>onik-zxcv Practice</title>
<meta name="description" content="onik-zxcv配列の練習用ページ" />
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="site-header">
    <h1>onik-zxcv Practice</h1>
  </header>

  <main class="layout">
    <section class="menu-panel" id="menu">
      <h2>練習を選ぶ</h2>
      <div class="options">
        <label class="option"><input type="checkbox" id="opt-alpha" checked /> アルファベットを練習する</label>
        <label class="option"><input type="checkbox" id="opt-num" /> 数字を練習する</label>
        <label class="option"><input type="checkbox" id="opt-sym" /> 記号を練習する</label>
      </div>
      <p class="menu-label">通常(ひらがなをローマ字で入力。変換なし)</p>
      <div class="menu-levels">
        <button type="button" class="menu-card" data-mode="sentence" data-level="easy">
          <span class="menu-card-title">簡単</span><span class="menu-card-sub">5文字</span>
        </button>
        <button type="button" class="menu-card" data-mode="sentence" data-level="normal">
          <span class="menu-card-title">普通</span><span class="menu-card-sub">10文字</span>
        </button>
        <button type="button" class="menu-card" data-mode="sentence" data-level="long">
          <span class="menu-card-title">長い</span><span class="menu-card-sub">20文字</span>
        </button>
      </div>
      <p class="menu-label">フロー(ランダムに並んだキーを左から順に入力)</p>
      <div class="menu-levels">
        <button type="button" class="menu-card" data-mode="flow">
          <span class="menu-card-title">フロー</span><span class="menu-card-sub">エンドレス</span>
        </button>
      </div>
    </section>

    <section class="practice-panel" id="practice-panel" hidden>
      <div class="lesson-info">
        <button type="button" class="back-btn" id="back-btn">← メニュー (Esc)</button>
        <h2 id="practice-title"></h2>
      </div>

      <div class="sentence-wrap" id="sentence-wrap">
        <div class="sentence-box" id="sentence"></div>
        <span class="lock-indicator" id="lock-indicator" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="5" y="11" width="14" height="10" rx="2"></rect>
            <path d="M8 11V7a4 4 0 0 1 8 0v4"></path>
          </svg>
        </span>
      </div>

      <div class="flow-wrap" id="flow-wrap" hidden>
        <div class="flow-lane" id="flow-lane"></div>
        <div class="flow-stats" id="flow-stats"></div>
      </div>

      <div class="keyboard" id="keyboard"></div>
      <div class="fingers" id="fingers"></div>
    </section>
  </main>

  <footer class="site-footer">
    <p>
      配列: <a href="https://note.com/oidy/n/n80f31fe43b98" target="_blank" rel="noopener noreferrer">onik-zxcv</a>
      ／ ソース: <a href="https://github.com/noma-t/onik-zxcv-practice" target="_blank" rel="noopener noreferrer">GitHub</a>
    </p>
  </footer>

<script src="layout-data.js"></script>
<script src="practice-data.js"></script>
<script src="app.js"></script>
</body>
</html>

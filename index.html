<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>onik-zxcv Practice</title>
<meta name="description" content="onik-zxcv配列の練習用ページ" />
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="site-header">
    <h1>onik-zxcv Practice</h1>
  </header>

  <main class="layout">
    <section class="practice-panel">
      <div class="lesson-info">
        <h2>総合練習</h2>
        <p id="mode-desc"></p>
      </div>

      <div class="options">
        <label class="option"><input type="checkbox" id="opt-alpha" checked /> アルファベットを練習する</label>
        <label class="option"><input type="checkbox" id="opt-num" /> 数字を練習する</label>
        <label class="option"><input type="checkbox" id="opt-sym" /> 記号を練習する</label>
        <label class="option" id="opt-length-label">文字数
          <select id="opt-length">
            <option value="5">5</option>
            <option value="8" selected>8</option>
            <option value="12">12</option>
            <option value="20">20</option>
            <option value="30">30</option>
          </select>
        </label>
        <div class="mode-switch" role="group" aria-label="モード">
          <button type="button" class="mode-btn" data-mode="sentence">通常</button>
          <button type="button" class="mode-btn" data-mode="flow">フロー</button>
        </div>
      </div>

      <div class="sentence-wrap" id="sentence-wrap">
        <div class="sentence-box" id="sentence"></div>
        <span class="lock-indicator" id="lock-indicator" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="5" y="11" width="14" height="10" rx="2"></rect>
            <path d="M8 11V7a4 4 0 0 1 8 0v4"></path>
          </svg>
        </span>
      </div>

      <div class="flow-wrap" id="flow-wrap" hidden>
        <div class="flow-lane" id="flow-lane"></div>
        <div class="flow-stats" id="flow-stats"></div>
      </div>

      <div class="keyboard" id="keyboard"></div>
      <div class="fingers" id="fingers"></div>
    </section>
  </main>

  <footer class="site-footer">
    <p>
      配列: <a href="https://note.com/oidy/n/n80f31fe43b98" target="_blank" rel="noopener noreferrer">onik-zxcv</a>
      ／ ソース: <a href="https://github.com/noma-t/onik-zxcv-practice" target="_blank" rel="noopener noreferrer">GitHub</a>
    </p>
  </footer>

<script src="layout-data.js"></script>
<script src="practice-data.js"></script>
<script src="app.js"></script>
</body>
</html>
